<!doctype html>
<html><head><meta charset="utf-8"><title>Connecting</title><link rel="stylesheet" href="style.css">
<style>
  .center { position: absolute; left: var(--safe-x); right: var(--safe-x); top: 360px; text-align: center; }
  .spinner { margin: 0 auto 48px; }
  .hint-late { margin: 28px auto 0; max-width: 900px; }
</style></head>
<body><div class="screen">
  <div class="backdrop"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="vignette"></div></div>
  <div class="center">
    <div class="spinner"></div>
    <div class="title">Connecting to iPhone</div>
    <!-- fades in after 3 s if the first frame has not arrived -->
    <div class="body hint-late">Keep Screen Mirroring open on your iPhone. This can take a few seconds.</div>
  </div>
  <div class="corner left">
    <div class="kv"><div class="caption">Network</div><div class="v tnum">203.0.113.24</div></div>
    <div class="kv"><div class="caption">Version</div><div class="v tnum">0.1.42</div></div>
  </div>
</div></body></html>
