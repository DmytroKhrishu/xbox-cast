<!doctype html>
<html><head><meta charset="utf-8"><title>Mirroring overlay</title><link rel="stylesheet" href="style.css">
<style>
  /* Opaque panel (#14141B), no full-width scrim: nothing see-through over the video. One row of controls,
     one hint row. Disconnect lives only in the hint (hold B), Stats only on the View button: no duplicates. The zoom
     stepper exists only while the mode is Zoom and sits right after the pills with no label of its own (overlay-zoom.html),
     so "Zoom" is never both a mode and a caption. */
  .overlay { position: absolute; left: var(--safe-x); right: var(--safe-x); bottom: var(--safe-y);
    padding: 30px 40px 30px; border-radius: 32px; background: var(--panel-solid);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.06), 0 24px 70px rgba(0,0,0,.6); }
  .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; height: 48px; }
  .who { display: flex; align-items: baseline; gap: 18px; }
  .who .name { font-size: 36px; font-weight: 600; }
  .row { display: flex; align-items: center; gap: 40px; }
  .label { font-size: 26px; font-weight: 600; color: var(--text-2); margin-right: 18px; }
  .stepper { display: flex; align-items: center; gap: 4px; }
  .spacer { flex: 1; }
  .minus, .plus { position: relative; width: 22px; height: 22px; }
  .minus::before, .plus::before, .plus::after { content: ""; position: absolute; background: currentColor; border-radius: 2px; }
  .minus::before, .plus::before { left: 0; right: 0; top: 9px; height: 4px; }
  .plus::after { top: 0; bottom: 0; left: 9px; width: 4px; }
  .btn.round { width: 64px; height: 64px; }
  .readout { min-width: 104px; }
  .group { display: flex; align-items: center; }
</style></head>
<body><div class="screen">
  <div id="video"></div><script src="phone.js"></script>

  <div class="overlay">
    <div class="top">
      <div class="who"><span class="name">iPhone</span><span class="small">Screen Mirroring</span></div>
      <div class="hints">
        <span class="hint"><span class="gs"><i class="g" data-g="X"></i></span>Sound</span>
        <span class="hint"><span class="gs"><i class="g" data-g="View"></i></span>Stats</span>
        <span class="hint"><span class="gs"><i class="g" data-g="B"></i></span>Close</span>
        <span class="hint"><span class="pre">Hold</span><span class="gs"><i class="g" data-g="B"></i></span>Disconnect</span>
      </div>
    </div>
    <div class="row">
      <div class="seg">
        <span class="btn">Fit</span><span class="btn">Fill</span><span class="btn">Zoom</span><span class="btn sel focus">Auto</span>
      </div>
      <div class="spacer"></div>
      <div class="group"><span class="label">Audio delay</span>
        <div class="stepper"><span class="btn round"><span class="minus"></span></span>
          <span class="readout tnum">0 ms</span><span class="btn round"><span class="plus"></span></span></div>
      </div>
    </div>
  </div>
</div><script src="glyphs.js"></script></body></html>
