<!doctype html>
<html><head><meta charset="utf-8"><title>Settings</title><link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="settings.css"></head>
<body><div class="screen">
  <div class="backdrop"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="vignette"></div></div>
  <div class="dim"></div>
  <div class="page">
    <div class="side" style="position:relative">
      <div class="title">Settings</div>
      <div class="cats">
        <div class="cat sel">Receiver</div>
        <div class="cat">Picture and Sound</div>
        <div class="cat">Advanced</div>
        <div class="cat">About</div>
      </div>
      <div class="desc">
        <div class="body">The largest picture your iPhone sends. Higher looks sharper on a 4K TV and uses more bandwidth.</div>
        <div class="note">Applies on next connection</div>
      </div>
    </div>
    <div style="position:relative">
      <div class="list">
        <div class="row"><span>Name</span><span class="val">Living Room</span></div>
        <div class="row focus"><span>Resolution</span><span class="val"><span class="chev l"></span>1080p<span class="chev r"></span></span></div>
        <div class="row"><span>Frame rate</span><span class="val"><span class="chev l"></span>60 fps<span class="chev r"></span></span></div>
        <div class="row"><span>H.265 video</span><span class="val">On<span class="switch on"></span></span></div>
        <div class="row"><span>Require code to connect</span><span class="val">Off<span class="switch"></span></span></div>
      </div>
      <div class="foot hints"><span class="hint"><span class="key">B</span>Back</span></div>
    </div>
  </div>
</div></body></html>
