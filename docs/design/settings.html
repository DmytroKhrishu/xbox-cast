<!doctype html>
<html><head><meta charset="utf-8"><title>Settings</title><link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="settings.css"></head>
<body><div class="screen">
  <div class="dim"></div>
  <div class="page">
    <div class="side" style="position:relative">
      <div class="title">Settings</div>
      <div class="cats">
        <div class="cat sel">Receiver</div>
        <div class="cat">Picture and Sound</div>
        <div class="cat">About</div>
      </div>
      <div class="desc">
        <div class="body">The name your iPhone shows in Screen Mirroring.</div>
        <div class="note">Applies on next connection</div>
      </div>
    </div>
    <div style="position:relative">
      <div class="list">
        <div class="row focus"><span>Name</span><span class="val">Living Room<span class="acc"><svg class="pencil" viewBox="0 0 32 32"><path d="M6 26l1.5-6L21 6.5a2.5 2.5 0 013.5 0l1 1a2.5 2.5 0 010 3.5L12 24.5z M18.5 9l4.5 4.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/></svg></span></span></div>
        <div class="row"><span>Resolution</span><span class="val">1080p<span class="acc"><span class="chev l"></span><span class="chev r"></span></span></span></div>
        <div class="row"><span>Frame rate</span><span class="val">60 fps<span class="acc"><span class="chev l"></span><span class="chev r"></span></span></span></div>
        <div class="row"><span>H.265 video</span><span class="val">On<span class="acc"><span class="switch on"></span></span></span></div>
        <div class="row"><span>Require code to connect</span><span class="val">Off<span class="acc"><span class="switch"></span></span></span></div>
      </div>
      <div class="foot hints">
        <span class="hint"><span class="gs"><i class="g" data-g="A"></i></span>Edit</span>
        <span class="hint"><span class="gs"><i class="g" data-g="B"></i></span>Back</span>
      </div>
    </div>
  </div>
</div><script src="glyphs.js"></script></body></html>
