<!doctype html>
<html><head><meta charset="utf-8"><title>Disconnected toast</title><link rel="stylesheet" href="style.css">
<style>
  /* Shown over the idle screen right after a session ends; slides down 24 px + fades in (300 ms), stays 4 s, fades out. */
  .toast { position: absolute; top: var(--safe-y); left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 22px; padding: 24px 40px 24px 30px; border-radius: 40px;
    background: rgba(30, 30, 40, 0.94); box-shadow: inset 0 0 0 1px rgba(255,255,255,.08), 0 20px 60px rgba(0,0,0,.5); }
  .t-dot { width: 14px; height: 14px; border-radius: 7px; background: rgba(255,255,255,.45); }
  .toast .t1 { font-size: 30px; font-weight: 600; }
  .toast .t2 { font-size: 26px; font-weight: 500; color: var(--text-2); }
  .center { position: absolute; left: var(--safe-x); right: var(--safe-x); top: 330px; text-align: center; }
  .status { display: inline-flex; align-items: center; gap: 16px; margin-bottom: 28px; }
  .dot { width: 14px; height: 14px; border-radius: 7px; background: var(--accent); box-shadow: 0 0 18px rgba(142,168,255,.8); }
  .how { margin: 44px auto 0; max-width: 1100px; font-size: 40px; }
</style></head>
<body><div class="screen">
  <div class="backdrop"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="vignette"></div></div>
  <div class="toast"><span class="t-dot"></span><span class="t1">Mirroring ended</span><span class="t2">iPhone disconnected</span></div>
  <div class="center">
    <div class="status eyebrow"><span class="dot"></span>Ready for Screen Mirroring</div>
    <div class="display">Living Room</div>
    <div class="body how">On your iPhone, open Control Center, tap <span class="strong nowrap">Screen Mirroring</span>
      and choose <span class="strong nowrap">Living Room</span>.</div>
  </div>
  <div class="corner left">
    <div class="kv"><div class="caption">Network</div><div class="v tnum">203.0.113.24</div></div>
    <div class="kv"><div class="caption">Version</div><div class="v tnum">0.1.42</div></div>
  </div>
  <div class="corner right"><span class="hint"><span class="key">Menu</span>Settings</span></div>
</div></body></html>
