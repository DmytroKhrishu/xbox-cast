<!doctype html>
<html><head><meta charset="utf-8"><title>Settings - Picture and Sound</title><link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="settings.css">
</head>
<body><div class="screen">
  <div class="dim"></div>
  <div class="page">
    <div class="side" style="position:relative">
      <div class="title">Settings</div>
      <div class="cats">
        <div class="cat">Receiver</div>
        <div class="cat sel">Picture and Sound</div>
        <div class="cat">About</div>
      </div>
      <div class="desc">
        <div class="body">Shifts the sound against the picture. Use it if voices run ahead of or behind lips on your TV.</div>
      </div>
    </div>
    <div style="position:relative">
      <div class="list">
        <div class="row"><span>Default view</span><span class="val">Auto<span class="acc"><span class="chev l"></span><span class="chev r"></span></span></span></div>
        <div class="row"><span>Remove black bars</span><span class="val">On<span class="acc"><span class="switch on"></span></span></span></div>
        <div class="row"><span>Sound</span><span class="val">On<span class="acc"><span class="switch on"></span></span></span></div>
        <div class="row focus"><span>Audio delay</span><span class="val">+40 ms<span class="acc"><span class="chev l"></span><span class="chev r"></span></span></span></div>
        <div class="row"><span>Show stats</span><span class="val">Off<span class="acc"><span class="switch"></span></span></span></div>
      </div>
      <div class="foot hints">
        <span class="hint"><span class="gs"><i class="g" data-g="A"></i></span>Reset</span>
        <span class="hint"><span class="gs"><i class="g" data-g="B"></i></span>Back</span>
      </div>
    </div>
  </div>
</div><script src="glyphs.js"></script></body></html>
